<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slip Setoran Sampah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDE8DC;
    --card:#F7F4EC;
    --ink:#2B2A25;
    --ink-soft:#63604F;
    --line:rgba(43,42,37,0.18);
    --accent:#B54E1F;
    --plastik:#3F6D5C;
    --kertas-arsip:#8B6F47;
    --marga:#6B7280;
    --kardus:#A67C52;
    --kaleng:#7C8DA6;
    --besi:#55606B;
    --tembaga:#A65E2E;
    --kaca:#7A6BA6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--paper);
    background-image:
      repeating-linear-gradient(0deg, rgba(43,42,37,0.02) 0px, rgba(43,42,37,0.02) 1px, transparent 1px, transparent 3px);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:48px 16px 80px;
  }
  .page-wrap{
    width:100%;
    max-width:600px;
  }
  .app-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    padding:0 6px 22px;
  }
  .app-brand{
    display:flex;
    align-items:center;
    gap:14px;
    min-width:0;
  }
  .app-logo{
    width:50px;
    height:50px;
    object-fit:contain;
    flex-shrink:0;
    border-radius:12px;
    background:#fff;
    padding:4px;
    filter:drop-shadow(0 2px 4px rgba(43,42,37,0.15));
  }
  .app-title-group{ min-width:0; }
  .app-title{
    font-family:'Space Mono',monospace;
    font-size:13px;
    font-weight:700;
    letter-spacing:0.02em;
    color:var(--ink);
    text-transform:uppercase;
    line-height:1.35;
  }
  .app-version{
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:0.04em;
    margin-top:3px;
  }
  .btn-dashboard{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:9px 16px;
    border-radius:8px;
    background:var(--ink);
    color:var(--paper);
    font-family:'Space Mono',monospace;
    font-size:12px;
    letter-spacing:0.05em;
    text-decoration:none;
    white-space:nowrap;
    flex-shrink:0;
    transition:background .15s ease, transform .15s ease;
  }
  .btn-dashboard:hover{ background:var(--accent); transform:translateY(-1px); }
  .btn-dashboard svg{ width:13px; height:13px; }

  .slip{
    width:100%;
  }
  .slip-top{
    background:var(--ink);
    color:var(--paper);
    padding:14px 28px;
    border-radius:14px 14px 0 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:'Space Mono',monospace;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
  }
  .slip-top span:last-child{ color: #C9A876; }
  .card{
    background:var(--card);
    border-radius:0 0 14px 14px;
    padding:32px 28px 28px;
    box-shadow:0 18px 40px -20px rgba(43,42,37,0.35);
    position:relative;
  }
  .perforation{
    height:14px;
    background:
      radial-gradient(circle at 12px 0, var(--paper) 7px, transparent 7.5px) repeat-x;
    background-size:24px 14px;
    background-position: 6px 0;
  }
  h1{
    font-family:'Space Mono',monospace;
    font-size:22px;
    letter-spacing:0.02em;
    margin:4px 0 2px;
  }
  .sub{
    font-size:13px;
    color:var(--ink-soft);
    margin:0 0 26px;
  }
  label{
    display:block;
    font-size:12px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .field{ margin-bottom:20px; }
  input[type=text], input[type=date], input[type=number], select, textarea{
    width:100%;
    padding:10px 12px;
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    color:var(--ink);
    background:#fff;
    border:1px solid var(--line);
    border-radius:8px;
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input:focus, select:focus, textarea:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(181,78,31,0.12);
  }
  textarea{ resize:vertical; min-height:70px; }

  .row-two{ display:flex; gap:16px; }
  .row-two > .field{ flex:1; }

  .items-label{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:10px;
  }
  .items-label label{ margin-bottom:0; }
  .items-count{ font-family:'Space Mono',monospace; font-size:11px; color:var(--ink-soft); }

  .item-row{
    display:flex;
    gap:12px;
    align-items:center;
    padding:12px 0;
    border-bottom:1px dashed var(--line);
    position:relative;
  }
  .item-row:first-child{ padding-top:0; }
  .item-icon{
    width:44px;
    height:44px;
    border-radius:12px;
    background:var(--line);
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    transition:background-color .15s ease;
  }
  .item-icon img{
    width:78%;
    height:78%;
    object-fit:contain;
    border-radius:8px;
    display:none;
  }
  .item-icon img.show{ display:block; }
  .item-fields{ flex:1; display:flex; gap:10px; flex-wrap:wrap; }
  .item-fields .jenis-wrap{ flex:1 1 170px; }
  .item-fields .bobot-wrap{ width:110px; }
  .bobot-wrap .unit-input{ display:flex; align-items:center; gap:6px; }
  .bobot-wrap .unit-input span{ font-family:'Space Mono',monospace; font-size:12px; color:var(--ink-soft); }

  .btn-remove{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:18px;
    line-height:1;
    cursor:pointer;
    padding:6px 4px;
    margin-top:2px;
    border-radius:6px;
  }
  .btn-remove:hover{ color:var(--accent); background:rgba(181,78,31,0.08); }

  .btn-add{
    margin-top:14px;
    background:none;
    border:1.5px dashed var(--ink-soft);
    color:var(--ink-soft);
    font-family:'Space Mono',monospace;
    font-size:12.5px;
    letter-spacing:0.03em;
    padding:9px 14px;
    border-radius:8px;
    cursor:pointer;
    width:100%;
    transition:all .15s ease;
  }
  .btn-add:hover{ border-color:var(--accent); color:var(--accent); }
  .btn-add:disabled{ opacity:0.4; cursor:not-allowed; }

  .total-box{
    margin-top:18px;
    background:var(--ink);
    color:var(--paper);
    border-radius:10px;
    padding:14px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .total-box .t-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:#C9A876;
  }
  .total-box .t-value{
    font-family:'Space Mono',monospace;
    font-size:24px;
    font-weight:700;
  }

  .submit-btn{
    width:100%;
    margin-top:26px;
    padding:14px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:8px;
    font-family:'Space Mono',monospace;
    font-size:14px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    cursor:pointer;
    transition:filter .15s ease;
  }
  .submit-btn:hover{ filter:brightness(1.08); }
  .submit-btn:disabled{ opacity:0.6; cursor:not-allowed; }

  .status-msg{
    margin-top:14px;
    padding:10px 14px;
    border-radius:8px;
    font-size:13.5px;
    display:none;
  }
  .status-msg.show{ display:block; }
  .status-msg.success{ background:rgba(63,109,92,0.15); color:var(--plastik); }
  .status-msg.error{ background:rgba(181,78,31,0.12); color:var(--accent); }

  @media (max-width:480px){
    .row-two{ flex-direction:column; }
    .item-fields .bobot-wrap{ width:90px; }
    .app-header{ justify-content:center; text-align:center; }
    .app-brand{ flex-direction:column; text-align:center; }
    .btn-dashboard{ width:100%; justify-content:center; }
  }
</style>
</head>
<body>

<div class="page-wrap">

  <div class="app-header">
    <div class="app-brand">
      <img class="app-logo" src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjcbUi75F5_xUcZ9OY2C1g59-ZbdDhjQFAcu5FUf0iI5A4RFMyeWpUed54cJEqkAxybQiiWlOjQ2-4xqUFmNo_jX4LlWoRE7yYdUSWP6eQQe2Pdqv0fh1jZ1Lo0o8Sp0bJBWsEuWWq1BLLiDvdcSssEEtZ8-PrF7IlYZ_qXELL7706mj-nPTXtUyDUzfr0/s500/LOGO%20BSIC%20(2)%20(1).png" alt="Logo Bank Sampah Insan Cendekia">
      <div class="app-title-group">
        <div class="app-title">Aplikasi Bank Sampah<br>Insan Cendekia</div>
        <div class="app-version">Versi 1.7</div>
      </div>
    </div>
    <a href="dashboard.html" class="btn-dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>
      Dashboard
    </a>
  </div>

<form class="slip" id="formSetoran">
  <div class="slip-top">
    <span>Bank Sampah</span>
    <span>Slip Setoran</span>
  </div>
  <div class="perforation"></div>
  <div class="card">
    <h1>Formulir Setoran Sampah</h1>
    <p class="sub">Isi data nasabah dan rincian sampah yang disetorkan.</p>

    <div class="field">
      <label for="jenis_nasabah_select">Jenis Nasabah</label>
      <select id="jenis_nasabah_select">
        <option value="siswa">Siswa</option>
        <option value="gtk">GTK (Guru / Tenaga Kependidikan)</option>
      </select>
    </div>

    <div class="row-two" id="siswaTingkatKelas">
      <div class="field">
        <label for="tingkat_select">Tingkat</label>
        <select id="tingkat_select">
          <option value="" disabled selected>Memuat data...</option>
        </select>
      </div>
      <div class="field">
        <label for="kelas_select">Kelas</label>
        <select id="kelas_select" disabled>
          <option value="" disabled selected>Pilih tingkat dulu</option>
        </select>
      </div>
    </div>

    <div class="field" id="siswaNamaWrap">
      <label for="nama_siswa_select">Nama Siswa</label>
      <select id="nama_siswa_select" disabled>
        <option value="" disabled selected>Pilih kelas dulu</option>
      </select>
    </div>

    <div class="field" id="gtkNamaWrap" style="display:none;">
      <label for="nama_gtk_select">Nama GTK</label>
      <select id="nama_gtk_select">
        <option value="" disabled selected>Memuat data...</option>
      </select>
    </div>

    <!-- Nilai final yang benar-benar dikirim ke server -->
    <input type="hidden" id="nama_nasabah_hidden" name="nama_nasabah">
    <input type="hidden" id="kelas_hidden" name="kelas">

    <div class="row-two">
      <div class="field">
        <label for="tanggal_penyetoran">Tanggal Penyetoran</label>
        <input type="date" id="tanggal_penyetoran" name="tanggal_penyetoran" required>
      </div>
    </div>

    <div class="row-two">
      <div class="field">
        <label for="petugas_teller_1">Petugas Teller 1 <span style="font-weight:400;text-transform:none;">(timbang)</span></label>
        <select id="petugas_teller_1" name="petugas_teller_1" required>
          <option value="" disabled selected>Memuat data...</option>
        </select>
      </div>
      <div class="field">
        <label for="petugas_teller_2">Petugas Teller 2 <span style="font-weight:400;text-transform:none;">(catat)</span></label>
        <select id="petugas_teller_2" name="petugas_teller_2" required>
          <option value="" disabled selected>Memuat data...</option>
        </select>
      </div>
    </div>

    <div class="field">
      <div class="items-label">
        <label>Rincian Sampah</label>
        <span class="items-count" id="itemsCount">1 / 4 baris</span>
      </div>

      <div id="itemsContainer"></div>

      <button type="button" class="btn-add" id="btnAddRow">+ Tambah Jenis Sampah</button>
    </div>

    <div class="total-box">
      <span class="t-label">Total Bobot</span>
      <span class="t-value"><span id="totalBobot">0.0</span> kg</span>
    </div>

    <div class="field" style="margin-top:20px;">
      <label for="keterangan">Keterangan</label>
      <textarea id="keterangan" name="keterangan" placeholder="Catatan tambahan (opsional)"></textarea>
    </div>

    <button type="submit" class="submit-btn" id="btnSubmit">Simpan Data Setoran</button>
    <div class="status-msg" id="statusMsg"></div>
  </div>
</form>

<script>
  const MAX_ROWS = 4;
  const container = document.getElementById('itemsContainer');
  const btnAdd = document.getElementById('btnAddRow');
  const itemsCount = document.getElementById('itemsCount');
  const totalBobotEl = document.getElementById('totalBobot');
  let rowIndex = 0;

  const tagColors = {
    plastik: 'var(--plastik)',
    kertas_arsip: 'var(--kertas-arsip)',
    marga: 'var(--marga)',
    kardus: 'var(--kardus)',
    kaleng: 'var(--kaleng)',
    besi: 'var(--besi)',
    tembaga: 'var(--tembaga)',
    kaca: 'var(--kaca)'
  };

  const iconUrls = {
    plastik: 'https://blogger.googleusercontent.com/img/a/AVvXsEhv5rkmUoBkbz3ZXHrIuFweThU1GlE8l7pzKYmF8MNaK-7yicf2Rh6u_mWob9yV9hoOTZc-sAgCZMm602LKL3maDlF7XRSex4U1UUpCwQlDrv-7MUgLU0G_yV6a9rNkFR0CU2iC4_RfDkwMMptiy3HaX3LHvgUu0Olp49X9kvH3TpjBzkoMmH-dR7Y_TRI=w65-h65',
    kertas_arsip: 'https://blogger.googleusercontent.com/img/a/AVvXsEijW8zKBp7TpjxiOXzHHhcB_ASyfXvQtdVhg3eVKxWP-5L3QZWrQK7b4t13J7jo5pb8M5iuvrcAM3geXJ8CSbZw1-dTrzjmdVIfhxYdQCanPYtsbLnj-4xb9NfalSI2WfeyQ581q5cnjjrXJw6ypfImjIEY26mvdy6pXO_Iq_jGaBa8E31XKPNvHJ1X3WA=w64-h64',
    marga: 'https://blogger.googleusercontent.com/img/a/AVvXsEjgUv-Pf_2vwU2ZdHEwmITDNGRo0GSVAWxHLJ11WUF_Oqca63eYj0wqGOHCkXJWyhXT9YG9yovse7OzlaNeeve4uIS16Z3wX9UaFkM3MLrBXaIQeTIOhVCU893qaVreMbJe7PyAsoZp99b1GhcGWbL8EKLyJImHW85EcuxGjiXZwVZm7VIORkTdNaRlHj8=w75-h75',
    kardus: 'https://blogger.googleusercontent.com/img/a/AVvXsEhsR_ikhdFVJzOjbdIpvnZGA27z9tD4J8K_DqUqpIzJn_3DG5ApIHcJNGKKbTf-dE0rbfpLh0rgOPp7rP1zj29X3e_LJQQOez8ERpJCWdPg4FtxS3QfEVhDeX_en9RhREqGTfh0WvjwpekAXtEBrUlts9VSZxrsNUp-B-fa88SCL9L5F_3rm6UoCg7S9r8',
    kaleng: 'https://blogger.googleusercontent.com/img/a/AVvXsEjM-CpkMZdZkJgr4W4OMofHpOisNTGRqCCw4yH2Atzzp57vdY91Mfi8u_kTTpbTdMuVGMSjyNVYkMJoVxGercpv0nlxZdETJ5jLKLBLgOr9wPkCtB6zkMeY8wGqvo-ykHGfQX3OR1x_dYzBmsaY6ZiuprycxfHv_XW_ziwnCyniIroxusNbm254bcQRovQ=w67-h67',
    besi: 'https://blogger.googleusercontent.com/img/a/AVvXsEh2ARWmbEhOHd66F2svxjQNL2y76DCUesoUPCdcXTGDU6N1rLOTfd7p8XQS20XuZ3cVHthiC6sNfivIhxkaRNTYcNjBFRP6A4-hcq3vVhPpHXd86vGTQeBO_xp5K7Ogm6fV-Ks__MxogJicxGjBesBw9M8M1pR4VNv8t3MgbA6UCH4qH0lepj7_LjkjpTQ=w56-h56',
    tembaga: 'https://blogger.googleusercontent.com/img/a/AVvXsEhldw3FV6zgfI5Uc-8X475VeW1h8pympd0wUFkqAhD6xx4ebmGCo-clVf57FPGpjbB3MvIN6FBDbQyMclwHnd1VKr7G0wELkBuasiOCsLZ4bf-AQgb9831Ds4X-bG8Ty4s0gevJRE54BG7IKmiqUXyKh6q04PilPYC1Z-FTNZyBb6DrvIhv-bLqklDxRO8=w67-h66',
    kaca: 'https://blogger.googleusercontent.com/img/a/AVvXsEh4TVC6ue5Sc13p5o1NBqbIag9QD9xzNnW_64mM8XoAADFwFytM7N4_u0QhgxYhxawti7JXM9LnsplmOu2HBV_HEuRFkurJ4l_uyk9NlpWBt6EGNvnhFCdd0z6nmn5QmD2dEEsoJpht08MuSquXbxjch4zqF6xd4A5TeECzNeTG7DYOJbZA9WoODkmVXFg=w59-h59'
  };

  function buatBaris(){
    rowIndex++;
    const row = document.createElement('div');
    row.className = 'item-row';
    row.dataset.rowId = rowIndex;

    row.innerHTML = `
      <div class="item-icon"><img alt=""></div>
      <div class="item-fields">
        <div class="jenis-wrap">
          <select name="jenis_sampah" required>
            <option value="" disabled selected>Pilih jenis</option>
            <option value="plastik">Plastik</option>
            <option value="kertas_arsip">Kertas Arsip</option>
            <option value="marga">Marga</option>
            <option value="kardus">Kardus</option>
            <option value="kaleng">Kaleng</option>
            <option value="besi">Besi</option>
            <option value="tembaga">Tembaga</option>
            <option value="kaca">Kaca</option>
          </select>
        </div>
        <div class="bobot-wrap">
          <div class="unit-input">
            <input type="number" name="bobot_sampah" step="0.1" min="0" placeholder="0.0" required>
            <span>kg</span>
          </div>
        </div>
      </div>
      <button type="button" class="btn-remove" title="Hapus baris">&times;</button>
    `;

    const select = row.querySelector('select');
    const iconBox = row.querySelector('.item-icon');
    const iconImg = row.querySelector('.item-icon img');
    const bobotInput = row.querySelector('input[name="bobot_sampah"]');
    const removeBtn = row.querySelector('.btn-remove');

    select.addEventListener('change', () => {
      const warna = tagColors[select.value] || 'var(--line)';
      iconBox.style.background = warna;
      if (iconUrls[select.value]) {
        iconImg.src = iconUrls[select.value];
        iconImg.alt = select.options[select.selectedIndex].text;
        iconImg.classList.add('show');
      } else {
        iconImg.classList.remove('show');
      }
    });

    bobotInput.addEventListener('input', hitungTotal);

    removeBtn.addEventListener('click', () => {
      row.remove();
      updateUI();
      hitungTotal();
    });

    container.appendChild(row);
    updateUI();
  }

  function updateUI(){
    const rows = container.querySelectorAll('.item-row');
    itemsCount.textContent = rows.length + ' / ' + MAX_ROWS + ' baris';
    btnAdd.disabled = rows.length >= MAX_ROWS;

    rows.forEach(r => {
      const removeBtn = r.querySelector('.btn-remove');
      removeBtn.style.visibility = rows.length > 1 ? 'visible' : 'hidden';
    });
  }

  function hitungTotal(){
    const rows = container.querySelectorAll('input[name="bobot_sampah"]');
    let total = 0;
    rows.forEach(r => { total += parseFloat(r.value) || 0; });
    totalBobotEl.textContent = total.toFixed(1);
  }

  btnAdd.addEventListener('click', buatBaris);

  // Isi tanggal hari ini otomatis
  document.getElementById('tanggal_penyetoran').valueAsDate = new Date();

  // Baris pertama otomatis muncul
  buatBaris();

  // ==== Bagian kirim data ke Google Apps Script ====
  const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbz1tXFzsfqW366ztLVVefnMwLk2pSJ1FsOXW39eSn8tBS9fwf4W-F3hGhhkRpHIsqMLOQ/exec';

  const form = document.getElementById('formSetoran');
  const btnSubmit = document.getElementById('btnSubmit');
  const statusMsg = document.getElementById('statusMsg');

  function tampilkanStatus(tipe, teks){
    statusMsg.textContent = teks;
    statusMsg.className = 'status-msg show ' + tipe;
  }

  // ==== Bagian ambil & atur data master (siswa, GTK, teller) dari spreadsheet ====
  const jenisNasabahSelect = document.getElementById('jenis_nasabah_select');
  const siswaTingkatKelas  = document.getElementById('siswaTingkatKelas');
  const siswaNamaWrap      = document.getElementById('siswaNamaWrap');
  const gtkNamaWrap        = document.getElementById('gtkNamaWrap');
  const tingkatSelect      = document.getElementById('tingkat_select');
  const kelasSelect        = document.getElementById('kelas_select');
  const namaSiswaSelect    = document.getElementById('nama_siswa_select');
  const namaGtkSelect      = document.getElementById('nama_gtk_select');
  const namaNasabahHidden  = document.getElementById('nama_nasabah_hidden');
  const kelasHidden        = document.getElementById('kelas_hidden');
  const selectTeller1      = document.getElementById('petugas_teller_1');
  const selectTeller2      = document.getElementById('petugas_teller_2');

  let masterDataCache = null;
  const URUTAN_TINGKAT = { 'X': 1, 'XI': 2, 'XII': 3 };

  function isiDropdown(selectEl, items, placeholder){
    selectEl.innerHTML = '';
    const optDefault = document.createElement('option');
    optDefault.value = '';
    optDefault.disabled = true;
    optDefault.selected = true;
    optDefault.textContent = items.length ? placeholder : 'Data tidak ditemukan';
    selectEl.appendChild(optDefault);

    items.forEach(function(nama){
      const opt = document.createElement('option');
      opt.value = nama;
      opt.textContent = nama;
      selectEl.appendChild(opt);
    });
  }

  // Fungsi ini dipanggil oleh Apps Script lewat teknik JSONP (bukan fetch biasa)
  window.isiMasterData = function(data){
    if (data.error) {
      console.error('Gagal memuat master data:', data.error);
      tampilkanStatus('error', 'Gagal memuat data master: ' + data.error);
      return;
    }
    masterDataCache = data;

    // Isi dropdown Tingkat (urut X, XI, XII)
    const tingkatList = [...new Set(data.siswa.map(s => s.tingkat))]
      .sort((a, b) => (URUTAN_TINGKAT[a] || 99) - (URUTAN_TINGKAT[b] || 99));
    isiDropdown(tingkatSelect, tingkatList, 'Pilih tingkat');

    // Isi dropdown GTK
    isiDropdown(namaGtkSelect, data.gtk.map(g => g.nama), 'Pilih nama');

    // Isi dropdown teller (seperti sebelumnya)
    isiDropdown(selectTeller1, data.teller, 'Pilih petugas');
    isiDropdown(selectTeller2, data.teller, 'Pilih petugas');
  };

  function muatMasterData(){
    const scriptTag = document.createElement('script');
    scriptTag.src = WEBAPP_URL + '?callback=isiMasterData';
    document.body.appendChild(scriptTag);
  }

  // Toggle antara Siswa dan GTK
  jenisNasabahSelect.addEventListener('change', function(){
    namaNasabahHidden.value = '';
    kelasHidden.value = '';

    if (jenisNasabahSelect.value === 'siswa') {
      siswaTingkatKelas.style.display = '';
      siswaNamaWrap.style.display = '';
      gtkNamaWrap.style.display = 'none';
    } else {
      siswaTingkatKelas.style.display = 'none';
      siswaNamaWrap.style.display = 'none';
      gtkNamaWrap.style.display = '';
    }
  });

  // Pilih Tingkat -> isi pilihan Kelas
  tingkatSelect.addEventListener('change', function(){
    const tingkat = tingkatSelect.value;
    const kelasList = masterDataCache.daftarKelas
      .filter(k => k.startsWith(tingkat + ' '))
      .map(k => k.split(' ').slice(1).join(' '));

    isiDropdown(kelasSelect, kelasList, 'Pilih kelas');
    kelasSelect.disabled = false;

    isiDropdown(namaSiswaSelect, [], 'Pilih kelas dulu');
    namaSiswaSelect.disabled = true;
    namaNasabahHidden.value = '';
    kelasHidden.value = '';
  });

  // Pilih Kelas -> isi pilihan Nama Siswa
  kelasSelect.addEventListener('change', function(){
    const kelasLengkap = tingkatSelect.value + ' ' + kelasSelect.value;
    const namaList = masterDataCache.siswaPerKelas[kelasLengkap] || [];

    isiDropdown(namaSiswaSelect, namaList, 'Pilih nama siswa');
    namaSiswaSelect.disabled = false;
    namaNasabahHidden.value = '';
    kelasHidden.value = kelasLengkap;
  });

  // Pilih Nama Siswa -> set nilai final
  namaSiswaSelect.addEventListener('change', function(){
    namaNasabahHidden.value = namaSiswaSelect.value;
  });

  // Pilih Nama GTK -> set nilai final (tanpa kelas)
  namaGtkSelect.addEventListener('change', function(){
    namaNasabahHidden.value = namaGtkSelect.value;
    kelasHidden.value = '';
  });

  muatMasterData();

  function resetNasabahFields(){
    jenisNasabahSelect.value = 'siswa';
    siswaTingkatKelas.style.display = '';
    siswaNamaWrap.style.display = '';
    gtkNamaWrap.style.display = 'none';

    if (masterDataCache) {
      const tingkatList = [...new Set(masterDataCache.siswa.map(s => s.tingkat))]
        .sort((a, b) => (URUTAN_TINGKAT[a] || 99) - (URUTAN_TINGKAT[b] || 99));
      isiDropdown(tingkatSelect, tingkatList, 'Pilih tingkat');
    }
    isiDropdown(kelasSelect, [], 'Pilih tingkat dulu');
    kelasSelect.disabled = true;
    isiDropdown(namaSiswaSelect, [], 'Pilih kelas dulu');
    namaSiswaSelect.disabled = true;

    namaNasabahHidden.value = '';
    kelasHidden.value = '';
  }

  form.addEventListener('submit', function(e){
    e.preventDefault(); // mencegah reload halaman seperti submit form biasa

    if (!namaNasabahHidden.value) {
      tampilkanStatus('error', 'Pilih nama nasabah terlebih dahulu (Siswa atau GTK).');
      return;
    }

    btnSubmit.disabled = true;
    btnSubmit.textContent = 'Mengirim...';
    statusMsg.className = 'status-msg';

    const formData = new FormData(form);

    fetch(WEBAPP_URL, {
      method: 'POST',
      mode: 'no-cors', // Apps Script tidak mengirim header CORS, jadi kita tak bisa baca responsnya
      body: formData
    })
      .then(() => {
        // Karena mode 'no-cors', kita tidak bisa membaca isi balasan server.
        // Kalau fetch tidak melempar error, kita anggap data berhasil terkirim.
        tampilkanStatus('success', 'Data terkirim. Silakan cek spreadsheet untuk memastikan tersimpan.');
        form.reset();
        resetNasabahFields();
        container.innerHTML = '';
        rowIndex = 0;
        buatBaris();
        document.getElementById('tanggal_penyetoran').valueAsDate = new Date();
        hitungTotal();
      })
      .catch(err => {
        tampilkanStatus('error', 'Tidak bisa terhubung ke server. Cek koneksi internet atau URL Web App.');
        console.error(err);
      })
      .finally(() => {
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Simpan Data Setoran';
      });
  });

</script>

</div>

</body>
</html>
